<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SkateShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            🛹 SkateShop
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="menu">

            <div class="navbar-nav ms-auto">

                <a class="nav-link active"
                   href="/">
                    Inicio
                </a>

                <a class="nav-link"
                   href="/ventas">
                    Comprar
                
                </a>
                <a class="nav-link"
                    href="/login">
                        Administrador
                </a>
            </div>

        </div>

    </div>

</nav>

<!-- HERO -->

<div class="container mt-5">

    <div class="p-5 bg-dark text-white rounded">

        <h1>Bienvenido a SkateShop</h1>

        <p class="lead">

            Tu tienda online especializada en skateboards,
            ruedas y accesorios.

        </p>

    </div>

</div>

<!-- PRODUCTOS -->

<div class="container mt-5">

    <h2 class="mb-4">
        Productos Disponibles
    </h2>

    <div class="row">

        <div class="col-md-4 mb-4"
             th:each="producto : ${productos}">

            <div class="card h-100 shadow">
                <img th:src="@{'/img/producto' + ${producto.id} + '.jpg'}"
                    onerror="this.src='https://picsum.photos/400/250';"
                    class="card-img-top"
                    style="height:250px; object-fit:cover;">

                <div class="card-body">

                    <h5 class="card-title"
                        th:text="${producto.nombre}">
                    </h5>

                    <p>

                        Precio:

                        <strong>
                            $<span th:text="${producto.precio}"></span>
                        </strong>

                    </p>

                    <p>

                        Stock:

                        <span class="badge bg-success"
                              th:text="${producto.stock}">
                        </span>

                    </p>

                </div>

                <div th:if="${producto.stock > 0}">
                    <a href="/ventas"
                    class="btn btn-success">
                        Comprar
                    </a>
                </div>

                <div th:if="${producto.stock == 0}">
                    <button class="btn btn-secondary"
                            disabled>
                        Agotado
                    </button>
                </div>

            </div>

        </div>

    </div>

</div>

<!-- FOOTER -->

<footer class="bg-dark text-white text-center p-3 mt-5">

    <p class="mb-0">

        SkateShop © 2026

    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
