<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Nuevo Producto</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="container mt-5">

<h1>Nuevo Producto</h1>

<form th:action="@{/guardar}"
      th:object="${producto}"
      method="post">

    <div class="mb-3">

        <label>Nombre</label>

        <input type="text"
       th:field="*{nombre}"
       class="form-control">

    <div class="text-danger"
        th:if="${#fields.hasErrors('nombre')}"
        th:errors="*{nombre}">
    </div>

    </div>

    <div class="mb-3">

        <label>Precio</label>

        <input type="number"
       th:field="*{precio}"
       class="form-control">

    <div class="text-danger"
        th:if="${#fields.hasErrors('precio')}"
        th:errors="*{precio}">
    </div>

    </div>

    <div class="mb-3">

        <label>Stock</label>

        <input type="number"
       th:field="*{stock}"
       class="form-control">

    <div class="text-danger"
        th:if="${#fields.hasErrors('stock')}"
        th:errors="*{stock}">
    </div>

    </div>

    <button class="btn btn-success w-100">
    Guardar Producto
    </button>
    <div class="alert alert-info">

        Complete los datos del producto.

    </div>
</form>

</body>
</html>
