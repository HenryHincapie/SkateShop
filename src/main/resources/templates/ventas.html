<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Registrar Venta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            🛹 SkateShop
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-lg-6 mx-auto">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h3 class="mb-0">

                        Finalizar Compra

                    </h3>

                </div>

                <div class="card-body">

                    <form method="post"
                          th:action="@{/ventas}">

                        <div class="mb-3">

                            <label class="form-label">

                                Producto

                            </label>

                            <select class="form-select"
                                    name="productoId"
                                    required>

                                <option value="">

                                    Seleccione un producto

                                </option>

                                <option th:each="producto : ${productos}"
                                        th:value="${producto.id}"
                                        th:text="${producto.nombre + ' | Stock: ' + producto.stock + ' | $' + producto.precio}">
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Cantidad

                            </label>

                            <input type="number"
                                   class="form-control"
                                   min="1"
                                   name="cantidad"
                                   required>

                        </div>

                        <button class="btn btn-success w-100">

                            Confirmar Compra

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- HISTORIAL -->

<div class="container mt-5">

    <h2>

        Historial de Ventas

    </h2>

    <table class="table table-striped table-hover">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Total</th>
            <th>Fecha</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="venta : ${transacciones}">

            <td th:text="${venta.id}"></td>

            <td th:text="${venta.producto.nombre}"></td>

            <td th:text="${venta.cantidad}"></td>

            <td th:text="${venta.total}"></td>

            <td th:text="${venta.fecha}"></td>

        </tr>

        </tbody>

    </table>

</div>

<script th:if="${success}">

Swal.fire({
icon:'success',
title:'Éxito',
text:'[[${success}]]'
});

</script>

<script th:if="${error}">

Swal.fire({
icon:'error',
title:'Error',
text:'[[${error}]]'
});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
