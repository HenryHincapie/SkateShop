<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Panel Administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">

        Panel de Administración

    </h1>

    <div class="row">

        <div class="col-md-4">

            <div class="card">

                <div class="card-body">

                    <h5>Productos</h5>

                    <p>
                        Gestionar inventario.
                    </p>

                    <a href="/productos"
                       class="btn btn-primary">

                        Ver Productos

                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <div class="card-body">

                    <h5>Ventas</h5>

                    <p>
                        Consultar transacciones.
                    </p>

                    <a href="/ventas"
                       class="btn btn-success">

                        Ver Ventas

                    </a>

                    <a href="/logout"
                       class="btn btn-danger">
                        Cerrar Sesión
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
