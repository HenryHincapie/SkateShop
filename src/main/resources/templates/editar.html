<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Editar Producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-warning">

                    <h3 class="mb-0">
                        Editar Producto
                    </h3>

                </div>

                <div class="card-body">

                    <form th:action="@{/guardar}"
                          th:object="${producto}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id}">

                        <div class="mb-3">

                            <label class="form-label">
                                Nombre
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{nombre}"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Precio
                            </label>

                            <input type="number"
                                   step="0.01"
                                   min="1"
                                   class="form-control"
                                   th:field="*{precio}"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Stock
                            </label>

                            <input type="number"
                                   min="0"
                                   class="form-control"
                                   th:field="*{stock}"
                                   required>

                        </div>

                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-success">

                                Guardar Cambios

                            </button>

                            <a href="/productos"
                               class="btn btn-secondary">

                                Cancelar

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
